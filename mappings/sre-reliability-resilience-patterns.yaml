# SRE Reliability & Resilience Patterns
# Owner: SRE Team
# Auto-generates skills and scripts via: make generate

metadata:
  version: "3.0.0"
  category: "sre_reliability_resilience"
  last_updated: "2026-04-15"
  maintainer: "sre-team@company.com"
  description: "Patterns to prevent outages and ensure resilient service behavior"

patterns:
  # ========================================
  # 1. TIMEOUT PROTECTION
  # ========================================
  - id: timeout_protection
    name: "Timeout Protection"
    severity: warning
    priority: 1
    source: "Service Maturity Pattern #13"

    detection:
      # Python - requests without timeout
      - language: python
        pattern: 'requests\.(get|post|put|delete|patch)\([^)]*\)'
        exclude: 'timeout\s*='
        file_types: ["*.py"]
        message: "HTTP call without timeout parameter"

      # Go - http.Client without timeout
      - language: go
        pattern: 'http\.Client\s*\{'
        exclude: 'Timeout\s*:'
        file_types: ["*.go"]
        message: "http.Client without Timeout field"

      # Go - sql.Open without context
      - language: go
        pattern: 'db\.Query\(|db\.Exec\('
        exclude: 'QueryContext|ExecContext'
        file_types: ["*.go"]
        message: "Database query without context timeout"

    guidance:
      description: "All external calls (HTTP, gRPC, database) must have timeout protection"
      impact: |
        - Service can hang indefinitely waiting for responses
        - Thread/goroutine pool exhaustion under load
        - Cascading failures across microservices
        - Unable to meet SLOs during dependency slowdowns
      fix: "Add timeout parameter to all external calls"
      example: |
        # Python - requests
        # ❌ BAD - No timeout
        response = requests.post(url, json=data)

        # ✅ GOOD - With timeout
        response = requests.post(url, json=data, timeout=10)

        # ✅ BETTER - Separate connect/read timeouts
        response = requests.post(url, json=data, timeout=(3, 10))

        # Go - http.Client
        // ❌ BAD - No timeout
        client := &http.Client{}

        // ✅ GOOD - With timeout
        client := &http.Client{
            Timeout: 10 * time.Second,
        }

        # Go - Database with context
        // ✅ GOOD - Context with timeout
        ctx, cancel := context.WithTimeout(context.Background(), 5*time.Second)
        defer cancel()
        rows, err := db.QueryContext(ctx, query, args...)
      references:
        - "https://requests.readthedocs.io/en/latest/user/advanced/#timeouts"
        - "https://pkg.go.dev/net/http#Client"

  # ========================================
  # 2. PANIC RECOVERY
  # ========================================
  - id: panic_recovery
    name: "Panic Recovery in Goroutines"
    severity: warning
    priority: 2
    source: "Production reliability best practice"

    detection:
      - language: go
        pattern: 'go\s+(func\(|[a-zA-Z])'
        exclude: 'defer\s+recover\(\)'
        file_types: ["*.go"]
        message: "Goroutine without panic recovery"

    guidance:
      description: "All goroutines must have defer recover() to prevent service crashes"
      impact: |
        - A panic in ANY goroutine crashes the ENTIRE service
        - No graceful degradation - complete service failure
        - Lost in-flight requests and connections
        - Difficult to debug root cause without recovery logging
      fix: "Add defer recover() with logging at the start of every goroutine"
      example: |
        // ❌ BAD - No recovery
        go func() {
            processData(item) // If this panics, entire service crashes
        }()

        // ✅ GOOD - With recovery
        go func() {
            defer func() {
                if r := recover(); r != nil {
                    log.Error().
                        Interface("panic", r).
                        Str("stack", string(debug.Stack())).
                        Msg("Recovered from panic in goroutine")
                }
            }()
            processData(item)
        }()

        // ✅ BETTER - Reusable recovery middleware
        func withRecover(fn func()) {
            go func() {
                defer func() {
                    if r := recover(); r != nil {
                        log.Error().
                            Interface("panic", r).
                            Str("stack", string(debug.Stack())).
                            Msg("Recovered from panic")
                    }
                }()
                fn()
            }()
        }

        // Usage
        withRecover(func() {
            processData(item)
        })
      references:
        - "https://go.dev/blog/defer-panic-and-recover"

  # ========================================
  # 3. RESOURCE NOT CLOSED
  # ========================================
  - id: resource_not_closed
    name: "Resource Leak Prevention"
    severity: warning
    priority: 3
    source: "Production reliability best practice"

    detection:
      # Go - HTTP response body not closed
      - language: go
        pattern: '\.Get\(|\.Post\(|\.Do\('
        require_after: 'defer.*\.Body\.Close\(\)'
        file_types: ["*.go"]
        message: "HTTP response body not closed with defer"

      # Go - Database rows not closed
      - language: go
        pattern: 'db\.Query\('
        require_after: 'defer.*\.Close\(\)'
        file_types: ["*.go"]
        message: "Database rows not closed with defer"

      # Python - files not closed
      - language: python
        pattern: 'open\('
        exclude: 'with\s+open'
        file_types: ["*.py"]
        message: "File opened without context manager (use 'with open')"

    guidance:
      description: "All resources (connections, files, HTTP responses) must be properly closed"
      impact: |
        - Connection pool exhaustion (cannot open new connections)
        - File descriptor leaks (hitting OS limits)
        - Memory leaks from unclosed HTTP response bodies
        - Service degradation over time, requiring restarts
      fix: "Use defer in Go or context managers in Python to ensure resources are closed"
      example: |
        # Go - HTTP Response
        // ❌ BAD - Body not closed
        resp, err := http.Get(url)
        body, _ := ioutil.ReadAll(resp.Body)

        // ✅ GOOD - Body closed with defer
        resp, err := http.Get(url)
        if err != nil {
            return err
        }
        defer resp.Body.Close()
        body, _ := ioutil.ReadAll(resp.Body)

        # Go - Database
        // ❌ BAD - Rows not closed
        rows, err := db.Query(query)
        for rows.Next() {
            // process
        }

        // ✅ GOOD - Rows closed with defer
        rows, err := db.Query(query)
        if err != nil {
            return err
        }
        defer rows.Close()
        for rows.Next() {
            // process
        }

        # Python - Files
        # ❌ BAD - File not closed
        f = open('file.txt', 'r')
        data = f.read()

        # ✅ GOOD - Context manager ensures close
        with open('file.txt', 'r') as f:
            data = f.read()
      references:
        - "https://go.dev/doc/effective_go#defer"

  # ========================================
  # 4. CIRCUIT BREAKER
  # ========================================
  - id: circuit_breaker
    name: "Circuit Breaker for External Services"
    severity: warning
    priority: 4
    source: "Service Maturity Pattern #12 - Cascading failures"

    detection:
      # Check if external calls exist but circuit breaker library not imported
      - language: go
        pattern: 'http\.Client|grpc\.Dial'
        exclude: 'hystrix|circuitbreaker|gobreaker'
        file_types: ["*.go"]
        message: "External service calls without circuit breaker protection"

      - language: python
        pattern: 'requests\.(get|post)'
        exclude: 'CircuitBreaker|pybreaker'
        file_types: ["*.py"]
        message: "External service calls without circuit breaker protection"

    guidance:
      description: "External service calls must be protected with circuit breaker pattern"
      impact: |
        - Cascading failures when external service degrades
        - Wasted resources on calls to failing services
        - No automatic recovery mechanism
        - Increased latency as timeouts accumulate
        - Inability to isolate and contain failures
      fix: "Wrap external service calls with circuit breaker library"
      example: |
        # Python - pybreaker
        from pybreaker import CircuitBreaker

        # Configure circuit breaker
        payment_breaker = CircuitBreaker(
            fail_max=5,              # Open circuit after 5 failures
            timeout_duration=60,     # Try again after 60 seconds
            reset_timeout=30         # Half-open after 30 seconds
        )

        @payment_breaker
        def call_payment_gateway(data):
            response = requests.post(
                PAYMENT_API_URL,
                json=data,
                timeout=10
            )
            return response.json()

        # Go - gobreaker
        import "github.com/sony/gobreaker"

        cb := gobreaker.NewCircuitBreaker(gobreaker.Settings{
            Name:        "payment-api",
            MaxRequests: 3,
            Interval:    time.Minute,
            Timeout:     time.Minute,
            ReadyToTrip: func(counts gobreaker.Counts) bool {
                return counts.ConsecutiveFailures > 5
            },
        })

        // Use circuit breaker
        result, err := cb.Execute(func() (interface{}, error) {
            return http.Get(paymentAPIURL)
        })
      references:
        - "https://martinfowler.com/bliki/CircuitBreaker.html"
        - "https://github.com/sony/gobreaker"

  # ========================================
  # 5. MISSING HEALTH ENDPOINT
  # ========================================
  - id: missing_health_endpoint
    name: "Health & Readiness Endpoints"
    severity: warning
    priority: 5
    source: "Kubernetes operational requirement"

    detection:
      - language: all
        pattern: '/health|/ready|/readiness|/healthz|/livez'
        file_types: ["*.py", "*.go", "*.js", "*.java"]
        invert: true
        message: "No health or readiness endpoint found"

    guidance:
      description: "Service must expose /health and /ready endpoints for Kubernetes probes"
      impact: |
        - Kubernetes cannot verify service health
        - Traffic routed to unhealthy pods
        - Failed deployments not detected automatically
        - Manual intervention required during rollouts
        - Increased MTTR (Mean Time To Recovery)
      fix: "Add /health (liveness) and /ready (readiness) endpoints"
      example: |
        # Python - Flask
        @app.route('/health')
        def health():
            """Liveness probe - is the service running?"""
            return jsonify({"status": "ok"}), 200

        @app.route('/ready')
        def readiness():
            """Readiness probe - can the service handle traffic?"""
            try:
                # Check dependencies
                db.execute("SELECT 1")
                cache.ping()

                return jsonify({"status": "ready"}), 200
            except Exception as e:
                logger.error(f"Readiness check failed: {e}")
                return jsonify({"status": "not ready", "error": str(e)}), 503

        # Go - HTTP
        func healthHandler(w http.ResponseWriter, r *http.Request) {
            w.WriteHeader(http.StatusOK)
            w.Write([]byte(`{"status":"ok"}`))
        }

        func readyHandler(w http.ResponseWriter, r *http.Request) {
            // Check database
            ctx, cancel := context.WithTimeout(context.Background(), 2*time.Second)
            defer cancel()

            if err := db.PingContext(ctx); err != nil {
                w.WriteHeader(http.StatusServiceUnavailable)
                w.Write([]byte(`{"status":"not ready"}`))
                return
            }

            w.WriteHeader(http.StatusOK)
            w.Write([]byte(`{"status":"ready"}`))
        }

        # Kubernetes manifest
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      references:
        - "https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/"
