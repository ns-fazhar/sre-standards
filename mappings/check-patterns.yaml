# SRE Check Patterns - Single Source of Truth
# Owner: SRE Team
# All changes must be approved via PR

metadata:
  version: "2.1.0"
  last_updated: "2026-03-26"
  maintainer: "sre-team@company.com"

checks:
  # ========================================
  # OBSERVABILITY CHECKS
  # ========================================

  - id: readiness-endpoint
    name: "Readiness Endpoint"
    category: observability
    severity: blocking

    automation:
      pattern: "/ready|/readiness"
      file_types: ["*.py", "*.go", "*.js", "*.java"]
      search_type: "grep"

    guidance:
      description: "Service must have /ready endpoint for Kubernetes readiness probes"
      impact: |
        - Kubernetes cannot verify if service dependencies are ready
        - May route traffic to unhealthy pods during startup
        - Cascading failures during rolling deployments
      fix: "Add readiness endpoint that checks all dependencies (DB, cache, APIs)"
      example: |
        @app.route('/ready')
        def readiness():
            \"\"\"Check if service and dependencies are ready\"\"\"
            try:
                # Check database
                db.execute("SELECT 1")

                # Check cache
                cache.ping()

                # Check critical APIs
                requests.get("https://api.example.com/health", timeout=5)

                return jsonify({"status": "ready"}), 200
            except Exception as e:
                logger.error(f"Readiness check failed: {e}")
                return jsonify({"status": "not ready", "error": str(e)}), 503
      references:
        - "https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/"

  - id: health-endpoint
    name: "Health Endpoint"
    category: observability
    severity: warning

    automation:
      pattern: "/health"
      file_types: ["*.py", "*.go", "*.js", "*.java"]
      search_type: "grep"

    guidance:
      description: "Basic health/liveness check endpoint"
      impact: "Load balancers and K8s cannot verify service is alive"
      fix: "Add /health endpoint for liveness probes"
      example: |
        @app.route('/health')
        def health():
            return jsonify({"status": "ok"}), 200

  - id: metrics-endpoint
    name: "Metrics Endpoint"
    category: observability
    severity: warning

    automation:
      pattern: "/metrics|prometheus"
      file_types: ["*.py", "*.go", "*.js", "*.java"]
      search_type: "grep"

    guidance:
      description: "Prometheus-compatible metrics endpoint"
      impact: "No visibility into service performance, cannot create alerts"
      fix: "Add /metrics endpoint exposing Prometheus metrics"
      example: |
        # Python
        from prometheus_flask_exporter import PrometheusMetrics
        metrics = PrometheusMetrics(app)

        # Go
        import "github.com/prometheus/client_golang/prometheus/promhttp"
        http.Handle("/metrics", promhttp.Handler())

  - id: structured-logging
    name: "Structured Logging"
    category: observability
    severity: warning

    automation:
      pattern: "json|structlog|JSON|logrus"
      file_types: ["*.py", "*.go", "*.js"]
      search_type: "grep"

    guidance:
      description: "Use structured (JSON) logging for easy parsing"
      impact: "Difficult to search/filter logs in production"
      fix: "Use structured logging library"
      example: |
        # Python
        from pythonjsonlogger import jsonlogger
        handler = logging.StreamHandler()
        handler.setFormatter(jsonlogger.JsonFormatter())

  # ========================================
  # RELIABILITY CHECKS
  # ========================================

  - id: http-timeouts
    name: "HTTP Timeouts"
    category: reliability
    severity: blocking

    automation:
      pattern: "timeout="
      context_required: "requests\\.(get|post|put|delete|patch)"
      file_types: ["*.py"]
      search_type: "grep"

    guidance:
      description: "All HTTP calls must have timeout parameters"
      impact: |
        - Service can hang indefinitely waiting for responses
        - Thread pool exhaustion
        - Cascading failures across microservices
      fix: "Add timeout parameter to all HTTP calls"
      example: |
        # ❌ BAD - No timeout
        response = requests.post(url, json=data)

        # ✅ GOOD - With timeout
        response = requests.post(url, json=data, timeout=30)

        # ✅ BETTER - Separate connect/read timeouts
        response = requests.post(url, json=data, timeout=(5, 30))
      references:
        - "https://requests.readthedocs.io/en/latest/user/advanced/#timeouts"

  - id: circuit-breaker
    name: "Circuit Breaker"
    category: reliability
    severity: blocking

    automation:
      pattern: "circuit|breaker|CircuitBreaker|Hystrix"
      file_types: ["*.py", "*.go", "*.js", "*.java"]
      search_type: "grep"

    guidance:
      description: "Protect against cascading failures with circuit breaker pattern"
      impact: |
        - Repeated calls to failing services waste resources
        - No automatic recovery mechanism
        - Cascading failures across services
      fix: "Implement circuit breaker for external service calls"
      example: |
        # Python
        from pybreaker import CircuitBreaker

        payment_breaker = CircuitBreaker(
            fail_max=5,           # Open after 5 failures
            timeout_duration=60   # Try again after 60 seconds
        )

        @payment_breaker
        def call_payment_gateway(data):
            return requests.post(url, json=data, timeout=30)

  - id: error-handling
    name: "Error Handling"
    category: reliability
    severity: warning

    automation:
      pattern: "try:|except |catch\\(|error"
      file_types: ["*.py", "*.go", "*.js", "*.java"]
      search_type: "grep"

    guidance:
      description: "Proper error handling to prevent crashes"
      impact: "Unhandled exceptions crash the service"
      fix: "Add try/catch blocks around critical operations"

  # ========================================
  # DEPLOYMENT CHECKS
  # ========================================

  - id: dockerfile
    name: "Dockerfile"
    category: deployment
    severity: warning

    automation:
      file_exists: "Dockerfile"

    guidance:
      description: "Service should have Dockerfile for containerization"
      impact: "Cannot deploy to Kubernetes"
      fix: "Create Dockerfile with proper base image and security"

  - id: kubernetes-manifests
    name: "Kubernetes Manifests"
    category: deployment
    severity: warning

    automation:
      path_exists: ["k8s/", "kubernetes/", "deploy/"]

    guidance:
      description: "K8s deployment manifests in repository"
      impact: "Deployment configuration not version controlled"
      fix: "Add K8s manifests to repository"

  # ========================================
  # SECURITY CHECKS
  # ========================================

  - id: dependency-management
    name: "Dependency Management"
    category: security
    severity: warning

    automation:
      file_exists: ["requirements.txt", "package.json", "go.mod", "pom.xml"]

    guidance:
      description: "Dependencies should be declared and version-pinned"
      impact: "Cannot track or update vulnerable dependencies"
      fix: "Create requirements.txt or equivalent"

  - id: no-hardcoded-secrets
    name: "No Hardcoded Secrets"
    category: security
    severity: blocking

    automation:
      pattern: "password.*=.*['\"][^'\"]+['\"]|api_key.*=.*['\"][^'\"]+['\"]"
      file_types: ["*.py", "*.go", "*.js", "*.java"]
      search_type: "grep"
      invert: true  # Should NOT find this pattern

    guidance:
      description: "No hardcoded passwords or API keys"
      impact: "Security breach if code is exposed"
      fix: "Use environment variables or secret management"

  # ========================================
  # DOCUMENTATION CHECKS
  # ========================================

  - id: readme
    name: "README"
    category: documentation
    severity: warning

    automation:
      file_exists: "README.md"

    guidance:
      description: "Service must have README documentation"
      impact: "New team members cannot understand the service"
      fix: "Create README.md with setup and usage instructions"

  - id: runbook
    name: "Runbook"
    category: documentation
    severity: blocking

    automation:
      file_exists: ["RUNBOOK.md", "docs/runbook.md", "OPERATIONS.md"]

    guidance:
      description: "Operational runbook for on-call engineers"
      impact: "On-call cannot respond to incidents effectively"
      fix: "Create RUNBOOK.md with troubleshooting steps"
      example: |
        # Service Runbook

        ## Common Issues

        ### High Latency
        - Check: Database connections
        - Action: Scale up replicas
        - Dashboard: grafana.com/d/service-latency

        ### 500 Errors
        - Check: External API health
        - Action: Enable circuit breaker
        - Logs: kubectl logs -l app=myservice
