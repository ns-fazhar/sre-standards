# SRE Standards - Enabled Pattern Configuration
# Owner: SRE Team
# Last Updated: 2026-04-15
#
# This file controls which patterns are enforced across ALL services.
# Services reference this repo via GitHub Actions and curl.
# To enable/disable a pattern, simply add/remove from the lists below.

metadata:
  version: "4.0.0"
  last_updated: "2026-04-23"
  maintainer: "SRE Team"
  description: "Central control for SRE pattern enforcement"

# ========================================
# RELIABILITY & RESILIENCE (5 patterns)
# ========================================
sre_reliability_resilience_checks:
  - timeout_protection          # Prevents hanging calls, resource exhaustion
  - panic_recovery             # Prevents service crashes from goroutines
  - resource_not_closed        # Prevents connection/file handle leaks
  - circuit_breaker            # Prevents cascading failures
  - missing_health_endpoint    # Essential for K8s liveness/readiness

# ========================================
# OBSERVABILITY (5 patterns)
# ========================================
sre_observability_checks:
  - metrics_instrumentation    # Required for SLI tracking and monitoring
  - central_logging           # Essential for debugging production issues
  - duration_metrics          # Track latency/performance for SLOs
  - request_id_propagation    # Essential for distributed tracing
  - missing_metrics_endpoint  # Required for Prometheus scraping

# ========================================
# OPERABILITY (5 patterns)
# ========================================
sre_operability_checks:
  - secrets_management        # Critical security - prevents credential leaks
  - no_graceful_shutdown      # Prevents dropped requests during deployments
  - env_vars_undocumented     # Config management, onboarding clarity
  - missing_dockerfile        # Containerization standard
  - config_not_validated      # Prevents runtime errors from bad config

# ========================================
# NPI - NEW PRODUCT INTRODUCTION (5 patterns)
# ========================================
sre_npi_checks:
  - sql_injection_risk        # Critical security vulnerability prevention
  - missing_tests             # Code quality gate, prevents regressions
  - api_breaking_changes      # Prevents customer-facing breakage
  - new_dependency_unapproved # Supply chain security, license compliance
  - schema_without_migration  # Prevents data inconsistency

# ========================================
# SEVERITY LEVELS
# ========================================
# critical: Must fix immediately (blocks PR in future)
# warning:  Should fix before merge (informative comment)
# info:     Nice to have (informative comment)

