# ========================================
# TOP 5 PATTERNS BY CATEGORY (Priority Enforcement)
# ========================================
# These are the most critical patterns for each category.
# Multi-language support: Python, Go, Java, Scala
# Based on: mappings/sre-top5-patterns.yaml

# SRE Checks (Reliability & Resilience) - Top 5
sre_checks:
  - http_timeouts                 # BLOCKING - Prevents cascading failures (95%)
  - circuit_breaker               # BLOCKING - Prevents service degradation (90%)
  - resource_leak                 # WARNING - Prevents connection exhaustion (85%)
  - retry_exponential_backoff     # WARNING - Graceful degradation (88%)
  - health_readiness              # WARNING - K8s operational requirement (90%)

# Operability - Top 5
operability:
  - no_hardcoded_secrets          # CRITICAL - Security compliance (99%)
  - graceful_shutdown             # WARNING - Prevents dropped requests (85%)
  - env_vars_documented           # INFO - Onboarding clarity (75%)
  - dockerfile_present            # WARNING - Containerization standard (88%)
  - config_validation             # INFO - Runtime error prevention (78%)

# Observability - Top 5
observability:
  - metrics_instrumentation       # WARNING - SLI tracking foundation (92%)
  - metrics_endpoint              # WARNING - Prometheus scraping (90%)
  - central_logging               # WARNING - SUMO Logic integration (87%)
  - duration_metrics              # WARNING - Latency SLO tracking (85%)
  - request_id_propagation        # INFO - Distributed tracing (80%)

# NPI (New Product Introduction) - Top 5
npi:
  - sql_injection                 # CRITICAL - Data breach prevention (99%)
  - feature_flag_detection        # WARNING - Safe rollout capability (85%)
  - database_migrations           # WARNING - Data consistency (88%)
  - api_breaking_changes          # WARNING - Backwards compatibility (82%)
  - test_coverage                 # WARNING - Quality gate (85%)
