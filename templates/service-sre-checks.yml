# SRE Standard Checks - Copy this to your service repo
# Location: .github/workflows/sre-checks.yml
#
# This workflow runs 3 types of checks on ALL PRs:
# 1. SRE Checks (Reliability) - entire codebase
# 2. Operability - entire codebase
# 3. Observability - entire codebase
#
# NPI checks are run separately on-demand via workflow_dispatch

name: SRE Checks

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  sre-standard-checks:
    name: SRE Standards
    permissions:
      contents: read
      pull-requests: write

    # Reference the central sre-standards repo
    # ✅ Always pulls latest from @main - zero maintenance!
    uses: ns-fazhar/sre-standards/.github/workflows/sre-standard-checks.yml@main

    with:
      # Set to true to BLOCK PR merges on critical issues
      fail_on_issues: false

# ============================================================================
# Configuration Options
# ============================================================================

# fail_on_issues: false (default - guidance mode)
#   - PRs can be merged even with issues
#   - Good for initial rollout
#   - Team gets familiar with checks before enforcement
#
# fail_on_issues: true (enforcement mode)
#   - PRs BLOCKED if critical issues found
#   - Enforces standards before merge
#   - Recommended after team is comfortable with checks

# ============================================================================
# What Gets Checked on Every PR (Automatic)
# ============================================================================

# 🔧 SRE Checks (Reliability & Resilience)
#   ✓ HTTP Timeout Protection (BLOCKING)
#   ✓ Circuit Breaker (BLOCKING)
#   ✓ Resource Leak Prevention
#   ✓ Retry with Exponential Backoff
#   ✓ Health & Readiness Endpoints

# ⚙️ Operability
#   ✓ No Hardcoded Secrets (CRITICAL)
#   ✓ Graceful Shutdown
#   ✓ Environment Variables Documented
#   ✓ Dockerfile Present
#   ✓ Configuration Validation

# 📊 Observability
#   ✓ Prometheus Metrics Instrumentation
#   ✓ Metrics Endpoint
#   ✓ Central Logging to SUMO Logic
#   ✓ Request Duration Tracking
#   ✓ Request ID Propagation

# ============================================================================
# NPI Checks (On-Demand Only)
# ============================================================================

# 🚀 NPI (New Product Introduction) - Run manually via workflow_dispatch
#   ✓ SQL Injection Prevention (CRITICAL)
#   ✓ Feature Flag Detection
#   ✓ Database Migrations
#   ✓ API Breaking Changes
#   ✓ Test Coverage
#
# To run NPI checks:
#   1. Go to Actions tab in GitHub
#   2. Select "NPI Checks (On-Demand)" workflow
#   3. Click "Run workflow"
#   4. Select your feature branch
#   5. Click "Run workflow" button
#
# Or use GitHub CLI:
#   gh workflow run npi-checks-manual.yml --ref feature/my-branch

# ============================================================================
# Local Testing
# ============================================================================

# Test all 3 automatic checks locally before pushing:
#   make sre-check            # SRE reliability
#   make operability-check    # Operability
#   make observability-check  # Observability
#
# Test NPI manually (on feature branch):
#   make npi-check
#
# Or use direct curl:
#   curl -fsSL https://raw.githubusercontent.com/ns-fazhar/sre-standards/main/generated/check-sre-top5.sh | bash
#   curl -fsSL https://raw.githubusercontent.com/ns-fazhar/sre-standards/main/generated/check-operability-top5.sh | bash
#   curl -fsSL https://raw.githubusercontent.com/ns-fazhar/sre-standards/main/generated/check-observability-top5.sh | bash
#   curl -fsSL https://raw.githubusercontent.com/ns-fazhar/sre-standards/main/generated/check-npi-top5.sh | bash

