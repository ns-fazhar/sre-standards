            <summary>📄 Click to see detailed results</summary>

            \`\`\`
            ${output}
            \`\`\`

            </details>

            ---
            🤖 Powered by [sre-standards](https://github.com/${context.repo.owner}/sre-standards) v${sreVersion}
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Operability Checks')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Check for critical issues
        if: inputs.fail_on_issues
        run: |
          EXIT_CODE="${{ steps.checks.outputs.exit_code }}"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "❌ Operability checks failed"
            exit 1
          fi

  observability-checks:
    name: Observability Checks
    runs-on: ubuntu-latest
    permissions:
