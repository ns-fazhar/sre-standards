            const sreVersion = fs.readFileSync('.sre-standards/VERSION', 'utf8').trim();

            const status = exitCode === '0' ? '✅ PASSED' : '❌ ISSUES FOUND';

            const criticalMatch = output.match(/(\d+) critical/i);
