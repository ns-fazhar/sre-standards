name: SRE Standard Checks (Reusable)

on:
  workflow_call:
    inputs:
      fail_on_issues:
        description: 'Fail workflow if critical issues found'
        type: boolean
        default: false

jobs:
  sre-standards:
    name: SRE Standards
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout service repository
        uses: actions/checkout@v4

      - name: Checkout SRE standards (central repo)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sre-standards
          path: .sre-standards
          ref: main

      - name: Show SRE standards version
        run: |
          echo "📦 Using SRE standards version: $(cat .sre-standards/VERSION)"
          echo ""

      # ============================================================================
      # Run all 3 checks sequentially in one job
      # ============================================================================

      - name: Run SRE Checks (Reliability & Resilience)
        id: sre-checks
        continue-on-error: true
        run: |
          echo "🔧 Running SRE Checks (Reliability & Resilience)..."
          .sre-standards/generated/check-sre.sh 2>&1 | tee sre-output.txt
          SRE_EXIT=${PIPESTATUS[0]}

          SRE_CRITICAL=$(grep -oP '\d+(?= critical)' sre-output.txt | head -1 || echo "0")
          SRE_WARNINGS=$(grep -oP '\d+(?= warning)' sre-output.txt | head -1 || echo "0")

          echo "exit_code=$SRE_EXIT" >> $GITHUB_OUTPUT
          echo "critical=$SRE_CRITICAL" >> $GITHUB_OUTPUT
          echo "warnings=$SRE_WARNINGS" >> $GITHUB_OUTPUT

      - name: Run Operability Checks
        id: operability-checks
        continue-on-error: true
        run: |
          echo ""
          echo "⚙️  Running Operability Checks..."
          .sre-standards/generated/check-operability.sh 2>&1 | tee operability-output.txt
          OPS_EXIT=${PIPESTATUS[0]}

          OPS_CRITICAL=$(grep -oP '\d+(?= critical)' operability-output.txt | head -1 || echo "0")
          OPS_WARNINGS=$(grep -oP '\d+(?= warning)' operability-output.txt | head -1 || echo "0")

          echo "exit_code=$OPS_EXIT" >> $GITHUB_OUTPUT
          echo "critical=$OPS_CRITICAL" >> $GITHUB_OUTPUT
          echo "warnings=$OPS_WARNINGS" >> $GITHUB_OUTPUT

      - name: Run Observability Checks
        id: observability-checks
        continue-on-error: true
        run: |
          echo ""
          echo "📊 Running Observability Checks..."
          .sre-standards/generated/check-observability.sh 2>&1 | tee observability-output.txt
          OBS_EXIT=${PIPESTATUS[0]}

          OBS_CRITICAL=$(grep -oP '\d+(?= critical)' observability-output.txt | head -1 || echo "0")
          OBS_WARNINGS=$(grep -oP '\d+(?= warning)' observability-output.txt | head -1 || echo "0")

          echo "exit_code=$OBS_EXIT" >> $GITHUB_OUTPUT
          echo "critical=$OBS_CRITICAL" >> $GITHUB_OUTPUT
          echo "warnings=$OBS_WARNINGS" >> $GITHUB_OUTPUT

      # ============================================================================
      # Post consolidated comment
      # ============================================================================

      - name: Post consolidated PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const sreVersion = fs.readFileSync('.sre-standards/VERSION', 'utf8').trim();

            const sreOutput = fs.readFileSync('sre-output.txt', 'utf8');
            const operabilityOutput = fs.readFileSync('operability-output.txt', 'utf8');
            const observabilityOutput = fs.readFileSync('observability-output.txt', 'utf8');

            const sreCode = '${{ steps.sre-checks.outputs.exit_code }}';
            const operabilityCode = '${{ steps.operability-checks.outputs.exit_code }}';
            const observabilityCode = '${{ steps.observability-checks.outputs.exit_code }}';

            const sreCritical = parseInt('${{ steps.sre-checks.outputs.critical }}' || '0');
            const operabilityCritical = parseInt('${{ steps.operability-checks.outputs.critical }}' || '0');
            const observabilityCritical = parseInt('${{ steps.observability-checks.outputs.critical }}' || '0');

            const sreWarnings = parseInt('${{ steps.sre-checks.outputs.warnings }}' || '0');
            const operabilityWarnings = parseInt('${{ steps.operability-checks.outputs.warnings }}' || '0');
            const observabilityWarnings = parseInt('${{ steps.observability-checks.outputs.warnings }}' || '0');

            const totalCritical = sreCritical + operabilityCritical + observabilityCritical;
            const totalWarnings = sreWarnings + operabilityWarnings + observabilityWarnings;

            const allPassed = sreCode === '0' && operabilityCode === '0' && observabilityCode === '0';
            const overallStatus = allPassed ? '✅ ALL CHECKS PASSED' : '❌ ISSUES FOUND';

            const sreStatus = sreCode === '0' ? '✅ PASSED' : '❌ ISSUES FOUND';
            const operabilityStatus = operabilityCode === '0' ? '✅ PASSED' : '❌ ISSUES FOUND';
            const observabilityStatus = observabilityCode === '0' ? '✅ PASSED' : '❌ ISSUES FOUND';

            const guidanceMode = !${{ inputs.fail_on_issues }};
            const modeEmoji = guidanceMode ? '💡' : '🚫';
            const modeText = guidanceMode ? 'GUIDANCE MODE' : 'ENFORCEMENT MODE';
            const modeDescription = guidanceMode
              ? '**This check is non-blocking** - You can merge this PR, but please address issues before production deployment.'
              : '**This check is blocking** - Critical issues must be fixed before merging.';

            const body = `## SRE Standard Checks: ${overallStatus}

            ${modeEmoji} **${modeText}**: ${modeDescription}

            **SRE Standards Version**: \`${sreVersion}\`
            **Summary**: ${totalCritical} critical issue(s), ${totalWarnings} warning(s) across 3 checks

            ### Results by Category
            - 🔧 **SRE Checks (Reliability & Resilience)**: ${sreStatus} (${sreCritical} critical, ${sreWarnings} warnings)
            - ⚙️ **Operability**: ${operabilityStatus} (${operabilityCritical} critical, ${operabilityWarnings} warnings)
            - 📊 **Observability**: ${observabilityStatus} (${observabilityCritical} critical, ${observabilityWarnings} warnings)

            ---

            <details>
            <summary><strong>🔧 SRE Checks (Reliability & Resilience)</strong></summary>

            \`\`\`
            ${sreOutput}
            \`\`\`

            </details>

            <details>
            <summary><strong>⚙️ Operability Checks</strong></summary>

            \`\`\`
            ${operabilityOutput}
            \`\`\`

            </details>

            <details>
            <summary><strong>📊 Observability Checks</strong></summary>

            Stack: Prometheus (metrics) + SUMO Logic (logging)

            \`\`\`
            ${observabilityOutput}
            \`\`\`

            </details>

            ---

            ### 💻 Run Checks Locally

            **Before pushing**, catch issues early by running checks on your machine:

            #### Option 1: Interactive with Claude Code
            \`\`\`bash
            # One-time setup
            cd ~/.claude/skills
            curl -O https://raw.githubusercontent.com/ns-fazhar/sre-standards/main/skills/sre-checks.md
            curl -O https://raw.githubusercontent.com/ns-fazhar/sre-standards/main/skills/operability.md
            curl -O https://raw.githubusercontent.com/ns-fazhar/sre-standards/main/skills/observability.md
            curl -O https://raw.githubusercontent.com/ns-fazhar/sre-standards/main/skills/npi.md

            # Use in your service
            cd your-service
            claude code
            > /sre-checks        # Deep analysis with guided fixes
            > /operability       # Operability review
            > /observability     # Observability validation
            \`\`\`

            #### Option 2: Command-Line Scripts (No Claude Required)
            \`\`\`bash
            # Add to your Makefile
            sre-check-all:
            	@curl -fsSL https://raw.githubusercontent.com/ns-fazhar/sre-standards/main/generated/check-sre.sh | bash
            	@curl -fsSL https://raw.githubusercontent.com/ns-fazhar/sre-standards/main/generated/check-operability.sh | bash
            	@curl -fsSL https://raw.githubusercontent.com/ns-fazhar/sre-standards/main/generated/check-observability.sh | bash

            # Run before committing
            make sre-check-all
            \`\`\`

            📖 **Full Guide**: [Local Development Documentation](https://github.com/ns-fazhar/sre-standards#-local-development-guide)

            ---
            🤖 Powered by [sre-standards](https://github.com/${context.repo.owner}/sre-standards) v${sreVersion}
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('SRE Standard Checks:')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
              console.log('Updated existing PR comment');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
              console.log('Created new PR comment');
            }

      # ============================================================================
      # Fail workflow if critical issues found
      # ============================================================================

      - name: Check for critical issues
        if: inputs.fail_on_issues
        run: |
          SRE_EXIT="${{ steps.sre-checks.outputs.exit_code }}"
          OPS_EXIT="${{ steps.operability-checks.outputs.exit_code }}"
          OBS_EXIT="${{ steps.observability-checks.outputs.exit_code }}"

          if [ "$SRE_EXIT" != "0" ] || [ "$OPS_EXIT" != "0" ] || [ "$OBS_EXIT" != "0" ]; then
            echo "❌ SRE standard checks failed"
            exit 1
          fi
