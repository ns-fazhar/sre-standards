name: SRE Standard Checks (Reusable)

on:
  workflow_call:
    inputs:
      fail_on_issues:
        description: 'Fail workflow if critical issues found'
        type: boolean
        default: false

jobs:
  # ============================================================================
  # CONTINUOUS VALIDATION: Run on ALL PRs (entire codebase)
  # ============================================================================

  sre-checks:
    name: SRE Checks (Reliability & Resilience)
    runs-on: ubuntu-latest
    outputs:
      exit_code: ${{ steps.checks.outputs.exit_code }}
      critical: ${{ steps.checks.outputs.critical }}
      warnings: ${{ steps.checks.outputs.warnings }}

    steps:
      - name: Checkout service repository
        uses: actions/checkout@v4

      - name: Checkout SRE standards (central repo)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sre-standards
          path: .sre-standards
          ref: main

      - name: Show SRE standards version
        run: |
          echo "📦 Using SRE standards version: $(cat .sre-standards/VERSION)"
          echo ""

      - name: Run SRE reliability checks
        id: checks
        continue-on-error: true
        run: |
          .sre-standards/generated/check-sre-top5.sh 2>&1 | tee check-output.txt
          EXIT_CODE=${PIPESTATUS[0]}

          CRITICAL=$(grep -oP '\d+(?= critical)' check-output.txt | head -1 || echo "0")
          WARNINGS=$(grep -oP '\d+(?= warning)' check-output.txt | head -1 || echo "0")

          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "warnings=$WARNINGS" >> $GITHUB_OUTPUT
          exit 0

      - name: Upload results artifact
        uses: actions/upload-artifact@v3
        with:
          name: sre-results
          path: check-output.txt
          retention-days: 7

      - name: Check for critical issues
        if: inputs.fail_on_issues
        run: |
          EXIT_CODE="${{ steps.checks.outputs.exit_code }}"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "❌ SRE reliability checks failed"
            exit 1
          fi

  operability-checks:
    name: Operability Checks
    runs-on: ubuntu-latest
    outputs:
      exit_code: ${{ steps.checks.outputs.exit_code }}
      critical: ${{ steps.checks.outputs.critical }}
      warnings: ${{ steps.checks.outputs.warnings }}

    steps:
      - name: Checkout service repository
        uses: actions/checkout@v4

      - name: Checkout SRE standards
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sre-standards
          path: .sre-standards
          ref: main

      - name: Run operability checks
        id: checks
        continue-on-error: true
        run: |
          .sre-standards/generated/check-operability-top5.sh 2>&1 | tee check-output.txt
          EXIT_CODE=${PIPESTATUS[0]}

          CRITICAL=$(grep -oP '\d+(?= critical)' check-output.txt | head -1 || echo "0")
          WARNINGS=$(grep -oP '\d+(?= warning)' check-output.txt | head -1 || echo "0")

          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "warnings=$WARNINGS" >> $GITHUB_OUTPUT
          exit 0

      - name: Upload results artifact
        uses: actions/upload-artifact@v3
        with:
          name: operability-results
          path: check-output.txt
          retention-days: 7

      - name: Check for critical issues
        if: inputs.fail_on_issues
        run: |
          EXIT_CODE="${{ steps.checks.outputs.exit_code }}"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "❌ Operability checks failed"
            exit 1
          fi

  observability-checks:
    name: Observability Checks
    runs-on: ubuntu-latest
    outputs:
      exit_code: ${{ steps.checks.outputs.exit_code }}
      critical: ${{ steps.checks.outputs.critical }}
      warnings: ${{ steps.checks.outputs.warnings }}

    steps:
      - name: Checkout service repository
        uses: actions/checkout@v4

      - name: Checkout SRE standards
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sre-standards
          path: .sre-standards
          ref: main

      - name: Run observability checks
        id: checks
        continue-on-error: true
        run: |
          .sre-standards/generated/check-observability-top5.sh 2>&1 | tee check-output.txt
          EXIT_CODE=${PIPESTATUS[0]}

          CRITICAL=$(grep -oP '\d+(?= critical)' check-output.txt | head -1 || echo "0")
          WARNINGS=$(grep -oP '\d+(?= warning)' check-output.txt | head -1 || echo "0")

          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "warnings=$WARNINGS" >> $GITHUB_OUTPUT
          exit 0

      - name: Upload results artifact
        uses: actions/upload-artifact@v3
        with:
          name: observability-results
          path: check-output.txt
          retention-days: 7

      - name: Check for critical issues
        if: inputs.fail_on_issues
        run: |
          EXIT_CODE="${{ steps.checks.outputs.exit_code }}"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "❌ Observability checks failed"
            exit 1
          fi

  # ============================================================================
  # POST CONSOLIDATED COMMENT
  # ============================================================================

  post-consolidated-comment:
    name: Post Consolidated PR Comment
    if: github.event_name == 'pull_request'
    needs: [sre-checks, operability-checks, observability-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout SRE standards
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sre-standards
          path: .sre-standards
          ref: main

      - name: Download all results
        uses: actions/download-artifact@v3

      - name: Post consolidated comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const sreVersion = fs.readFileSync('.sre-standards/VERSION', 'utf8').trim();

            const sreOutput = fs.readFileSync('sre-results/check-output.txt', 'utf8');
            const operabilityOutput = fs.readFileSync('operability-results/check-output.txt', 'utf8');
            const observabilityOutput = fs.readFileSync('observability-results/check-output.txt', 'utf8');

            const sreCode = '${{ needs.sre-checks.outputs.exit_code }}';
            const operabilityCode = '${{ needs.operability-checks.outputs.exit_code }}';
            const observabilityCode = '${{ needs.observability-checks.outputs.exit_code }}';

            const sreCritical = parseInt('${{ needs.sre-checks.outputs.critical }}' || '0');
            const operabilityCritical = parseInt('${{ needs.operability-checks.outputs.critical }}' || '0');
            const observabilityCritical = parseInt('${{ needs.observability-checks.outputs.critical }}' || '0');

            const sreWarnings = parseInt('${{ needs.sre-checks.outputs.warnings }}' || '0');
            const operabilityWarnings = parseInt('${{ needs.operability-checks.outputs.warnings }}' || '0');
            const observabilityWarnings = parseInt('${{ needs.observability-checks.outputs.warnings }}' || '0');

            const totalCritical = sreCritical + operabilityCritical + observabilityCritical;
            const totalWarnings = sreWarnings + operabilityWarnings + observabilityWarnings;

            const allPassed = sreCode === '0' && operabilityCode === '0' && observabilityCode === '0';
            const overallStatus = allPassed ? '✅ ALL CHECKS PASSED' : '❌ ISSUES FOUND';

            const sreStatus = sreCode === '0' ? '✅ PASSED' : '❌ ISSUES FOUND';
            const operabilityStatus = operabilityCode === '0' ? '✅ PASSED' : '❌ ISSUES FOUND';
            const observabilityStatus = observabilityCode === '0' ? '✅ PASSED' : '❌ ISSUES FOUND';

            const body = `## SRE Standard Checks: ${overallStatus}

            **SRE Standards Version**: \`${sreVersion}\`
            **Summary**: ${totalCritical} critical issue(s), ${totalWarnings} warning(s) across 3 checks

            ### Results by Category
            - 🔧 **SRE Checks (Reliability & Resilience)**: ${sreStatus} (${sreCritical} critical, ${sreWarnings} warnings)
            - ⚙️ **Operability**: ${operabilityStatus} (${operabilityCritical} critical, ${operabilityWarnings} warnings)
            - 📊 **Observability**: ${observabilityStatus} (${observabilityCritical} critical, ${observabilityWarnings} warnings)

            ---

            <details>
            <summary><strong>🔧 SRE Checks (Reliability & Resilience)</strong></summary>

            \`\`\`
            ${sreOutput}
            \`\`\`

            </details>

            <details>
            <summary><strong>⚙️ Operability Checks</strong></summary>

            \`\`\`
            ${operabilityOutput}
            \`\`\`

            </details>

            <details>
            <summary><strong>📊 Observability Checks</strong></summary>

            Stack: Prometheus (metrics) + SUMO Logic (logging)

            \`\`\`
            ${observabilityOutput}
            \`\`\`

            </details>

            ---
            🤖 Powered by [sre-standards](https://github.com/${context.repo.owner}/sre-standards) v${sreVersion}
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('SRE Standard Checks:')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
              console.log('Updated existing PR comment');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
              console.log('Created new PR comment');
            }

