name: SRE Standard Checks (Reusable)

on:
  workflow_call:
    inputs:
      fail_on_issues:
        description: 'Fail workflow if critical issues found'
        type: boolean
        default: false

jobs:
  # ============================================================================
  # CONTINUOUS VALIDATION: Run on ALL PRs (entire codebase)
  # ============================================================================

  sre-checks:
    name: SRE Checks (Reliability & Resilience)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout service repository
        uses: actions/checkout@v4

      - name: Checkout SRE standards (central repo)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sre-standards
          path: .sre-standards
          ref: main

      - name: Show SRE standards version
        run: |
          echo "📦 Using SRE standards version: $(cat .sre-standards/VERSION)"
          echo ""

      - name: Run SRE reliability checks
        id: checks
        continue-on-error: true
        run: |
          .sre-standards/generated/check-sre-top5.sh 2>&1 | tee check-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit 0

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('check-output.txt', 'utf8');
            const exitCode = '${{ steps.checks.outputs.exit_code }}';
            const sreVersion = fs.readFileSync('.sre-standards/VERSION', 'utf8').trim();

            const status = exitCode === '0' ? '✅ PASSED' : '❌ ISSUES FOUND';

            const criticalMatch = output.match(/(\d+) critical/i);
            const warningsMatch = output.match(/(\d+) warning/i);
            const critical = criticalMatch ? criticalMatch[1] : '0';
            const warnings = warningsMatch ? warningsMatch[1] : '0';

            const body = `## 🔧 SRE Checks (Reliability & Resilience): ${status}

            **SRE Standards Version**: \`${sreVersion}\`
            **Summary**: ${critical} critical issue(s), ${warnings} warning(s)

            <details>
            <summary>📄 Click to see detailed results</summary>

            \`\`\`
            ${output}
            \`\`\`

            </details>

            ---
            🤖 Powered by [sre-standards](https://github.com/${context.repo.owner}/sre-standards) v${sreVersion}
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('SRE Checks (Reliability & Resilience)')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Check for critical issues
        if: inputs.fail_on_issues
        run: |
          EXIT_CODE="${{ steps.checks.outputs.exit_code }}"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "❌ SRE reliability checks failed"
            exit 1
          fi

